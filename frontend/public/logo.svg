<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barbell">
  <!--
    BARBELL wordmark. "bar" and "ell" are set as bold text; the second "b"
    is replaced by a drawn circular badge, never a font glyph, so the
    icon's geometry is exact and font-independent. This SVG is served
    standalone via an img tag, which renders in an isolated context with
    no access to the page's own font-face rules, so anything depending on
    a precise glyph shape rather than a generic bold sans-serif fallback
    would drift across browsers and operating systems. The badge, a red
    disc holding a white barbell (a bar with a weight plate at each end),
    reads clearly at both large (login hero, about 56px) and small
    (nav bar, about 36px) sizes.
  -->
  <text x="2" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="92" fill="#E42313" letter-spacing="-2">bar</text>

  <!-- circular badge standing in for the second "b" -->
  <g transform="translate(197, 6)">
    <circle cx="54" cy="54" r="54" fill="#E42313" />
    <!-- barbell glyph: horizontal bar + two plates per side, in white -->
    <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
      <line x1="26" y1="54" x2="82" y2="54" />
    </g>
    <rect x="20" y="38" width="10" height="32" rx="3" fill="#FFFFFF" />
    <rect x="10" y="44" width="8" height="20" rx="2.5" fill="#FFFFFF" />
    <rect x="78" y="38" width="10" height="32" rx="3" fill="#FFFFFF" />
    <rect x="90" y="44" width="8" height="20" rx="2.5" fill="#FFFFFF" />
  </g>

  <text x="311" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="92" fill="#E42313" letter-spacing="-2">ell</text>
</svg>
