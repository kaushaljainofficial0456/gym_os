<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK OS — Train smarter. Coach better. Prove progress.</title>
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Fonts are SELF-HOSTED (public/fonts, 145 kB total) rather than pulled
       from a font CDN. Two reasons that matter here: a third-party font
       request costs an extra DNS + TLS handshake before any text can
       paint, and a CDN miss shows the fallback face first — that flash of
       the wrong typeface is the single most "unfinished" thing a premium
       UI can do on first load. Preloading the two faces used above the
       fold means the hero renders in the real type on first paint. -->
  <link rel="preload" href="/fonts/dmsans-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/sentient-400.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
